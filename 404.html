<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | MakeProjects.in</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0fdf4;
      color: #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 800;
      color: #059669;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1rem;
    }
    p {
      max-width: 450px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.75rem;
      background: #059669;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-home:hover {
      background: #047857;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Head back to the homepage to explore IEEE and final year projects.</p>
  <a href="/" class="btn-home">← Back to Homepage</a>
</body>
</html>
